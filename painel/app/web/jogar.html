<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Alicia Server — Jogar</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#e9ecf5;font-family:system-ui,sans-serif;overflow:hidden}
#game{width:100%;height:100%}
#topo{position:fixed;top:8px;left:8px;z-index:50;display:flex;gap:8px;align-items:center}
#topo a,#topo span{background:#1a1d27cc;color:#e9ecf5;padding:10px 16px;border-radius:12px;text-decoration:none;font-size:16px}
#topo a:focus,#topo a:hover{outline:3px solid #a78bfa}
#sala{background:#7c5cf0;color:#fff;padding:10px 16px;border-radius:12px;font-size:16px;cursor:pointer;display:none}
#sala small{opacity:.85;margin-left:8px}
#aviso{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:24px;font-size:20px;background:#0f1117;z-index:60}
</style></head>
<body>
<div id="topo"><a href="/" id="voltar" tabindex="0">⬅ Voltar aos jogos</a><button id="ctl" type="button" tabindex="0" style="background:#1a1d27cc;color:#e9ecf5;padding:10px 16px;border-radius:12px;border:0;font-size:16px;cursor:pointer">🎮 Controle</button><span id="msg"></span><span id="sala" title="Toque para copiar o link da sala"></span></div>
<div id="aviso"><div id="avisoTxt"></div></div>
<div id="game"></div>
<script src="/static/controle.js"></script>
<script>
// Emulador rodando NO NAVEGADOR deste aparelho (EmulatorJS). O servidor só entrega o jogo e guarda o save.
const q = new URLSearchParams(location.search), pasta = q.get('c'), arquivo = q.get('a'), MULTI = q.get('m') === '1';
const $ = s => document.querySelector(s);
const qs = 'pasta=' + encodeURIComponent(pasta) + '&arquivo=' + encodeURIComponent(arquivo);
function erro(t){ $('#aviso').style.display='grid'; $('#avisoTxt').innerHTML = t + '<br><br><a href="/" style="color:#a78bfa">Voltar</a>'; }

(async () => {
  try {
    const info = await (await fetch('/api/jogos/info?pasta=' + encodeURIComponent(pasta))).json();
    if (!info.nucleo) return erro('Console desconhecido.');
    if (!info.emulador_instalado) return erro('O emulador ainda não está instalado no servidor.');
    window.EJS_player = '#game';
    window.EJS_core = info.nucleo;
    window.EJS_gameUrl = '/api/jogos/arquivo?' + qs;
    window.EJS_gameName = arquivo.replace(/\.[^.]+$/, '');
    window.EJS_pathtodata = '/ejs/';
    window.EJS_color = '#7c5cf0';
    window.EJS_startOnLoaded = true;           // começa sozinho, sem clicar em "play"
    window.EJS_language = 'pt-BR';
    window.EJS_threads = false;                // não exige cabeçalhos especiais; funciona em qualquer navegador
    if (pasta === 'PlayStation') {                     // BIOS do PS1 (se você colocou em Jogos/BIOS)
      const b = await fetch('/api/jogos/bios?pasta=PlayStation', {method: 'HEAD'});
      if (b.ok) window.EJS_biosUrl = '/api/jogos/bios?pasta=PlayStation';
      else $('#msg').textContent = 'Sem BIOS do PS1: alguns jogos podem não abrir (veja JOGOS.md).';
    }
    // Continua de onde parou, em qualquer aparelho: se existe save no servidor, carrega.
    const s = await fetch('/api/jogos/save?' + qs, {method: 'HEAD'});
    if (s.ok) { window.EJS_loadStateURL = '/api/jogos/save?' + qs; $('#msg').textContent = 'Continuando de onde você parou…'; }
    fetch('/api/jogos/inicio', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({pasta, arquivo})});

    // Salva o estado no servidor de tempos em tempos (a cada 2 min), ao pausar/sair e quando você usa o botão de salvar.
    let ultimo = 0;
    async function salvar() {
      try {
        const gm = window.EJS_emulator && window.EJS_emulator.gameManager;
        if (!gm) return;
        const st = gm.getState();
        if (!st || st.length < 1000) return;
        await fetch('/api/jogos/save?' + qs, {method:'POST', body: st, keepalive: st.length < 60000});
        ultimo = Date.now(); $('#msg').textContent = 'Progresso salvo ✓'; setTimeout(() => $('#msg').textContent = '', 2500);
      } catch (e) {}
    }
    if (MULTI) {                                       // multiplayer: guarda o áudio do jogo para transmitir aos amigos
      const orig = AudioNode.prototype.connect;
      AudioNode.prototype.connect = function (t, ...a) {
        const r = orig.call(this, t, ...a);
        try { if (t instanceof AudioDestinationNode) { if (!window.__dest || window.__dest.context !== t.context) window.__dest = t.context.createMediaStreamDestination(); orig.call(this, window.__dest); } } catch (e) {}
        return r;
      };
    }
    window.EJS_onGameStart = () => {
      setInterval(salvar, 120000); if (MULTI) setTimeout(iniciarSala, 1500);
      try { window.EJS_emulator.gamepad.listeners = {}; } catch (e) {}          // a leitura de controle do emulador erra em vários modelos: usamos a nossa (controle.js)
      AliciaPad.iniciar({ console: pasta, maxJogadores: MULTI ? 1 : 4, botao: $('#ctl'),
        enviar: (j, i, v) => { const gm = window.EJS_emulator && window.EJS_emulator.gameManager; if (gm) gm.simulateInput(j, i, v); } });
    };
    window.EJS_onSaveState = () => salvar();
    document.addEventListener('visibilitychange', () => { if (document.hidden) salvar(); });
    // Dentro do painel (camada sobre a página), "Voltar" só fecha o jogo e a música continua; fora dele, volta para o início.
    $('#voltar').addEventListener('click', async e => {
      e.preventDefault(); await salvar();
      if (window.parent !== window) parent.postMessage('fechar-jogo', location.origin); else location.href = '/';
    });

    const sc = document.createElement('script'); sc.src = '/ejs/loader.js';
    sc.onerror = () => erro('Não consegui carregar o emulador.'); document.body.appendChild(sc);
  } catch (e) { erro('Não consegui abrir o jogo. Confira se você está logado e se o servidor está ligado.'); }
})();

// ---------- Multiplayer: este aparelho é o anfitrião; os amigos veem a tela e mandam os controles ----------
function iniciarSala() {
  const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws/multi');
  const pares = {}, etiqueta = $('#sala'); let codigo = '', nomes = {};
  const canvas = document.querySelector('#game canvas');
  const fluxo = canvas && canvas.captureStream ? canvas.captureStream(60) : null;
  const atualiza = () => { const n = Object.keys(nomes).length; etiqueta.style.display = 'inline-block'; etiqueta.innerHTML = '👥 Sala <b>' + codigo + '</b><small>' + (n ? (n + 1) + ' jogador(es): você' + Object.values(nomes).map(x => ', ' + x).join('') : 'esperando amigos…') + '</small>'; };
  etiqueta.onclick = () => { const l = location.origin + '/multi?sala=' + codigo; (navigator.clipboard ? navigator.clipboard.writeText(l) : Promise.reject()).then(() => $('#msg').textContent = 'Link da sala copiado ✓', () => $('#msg').textContent = 'Código da sala: ' + codigo); setTimeout(() => $('#msg').textContent = '', 3000); };
  ws.onopen = () => ws.send(JSON.stringify({ t: 'host', pasta, arquivo }));
  ws.onmessage = async ev => {
    const m = JSON.parse(ev.data);
    if (m.t === 'sala') { codigo = m.codigo; atualiza(); }
    else if (m.t === 'erro') { $('#msg').textContent = m.msg; }
    else if (m.t === 'entrou') {
      const pc = new RTCPeerConnection({ iceServers: [] }); pares[m.id] = { pc, slot: m.slot }; nomes[m.id] = m.nome; atualiza();
      if (fluxo) fluxo.getVideoTracks().forEach(t => pc.addTrack(t, fluxo));
      if (window.__dest) window.__dest.stream.getAudioTracks().forEach(t => pc.addTrack(t, window.__dest.stream));
      const dc = pc.createDataChannel('controle', { ordered: true });
      dc.onmessage = e => { try { const c = JSON.parse(e.data); const gm = window.EJS_emulator && window.EJS_emulator.gameManager; if (gm) gm.simulateInput(m.slot, c.i, c.v); } catch (x) {} };
      pc.onicecandidate = e => { if (e.candidate) ws.send(JSON.stringify({ t: 'sinal', para: m.id, d: { cand: e.candidate } })); };
      await pc.setLocalDescription(await pc.createOffer());
      ws.send(JSON.stringify({ t: 'sinal', para: m.id, d: { sdp: pc.localDescription } }));
      $('#msg').textContent = m.nome + ' entrou como jogador ' + (m.slot + 1); setTimeout(() => $('#msg').textContent = '', 4000);
    } else if (m.t === 'saiu') {
      if (pares[m.id]) { pares[m.id].pc.close(); delete pares[m.id]; } delete nomes[m.id]; atualiza();
    } else if (m.t === 'sinal' && pares[m.de]) {
      const pc = pares[m.de].pc;
      if (m.d.sdp) await pc.setRemoteDescription(m.d.sdp); else if (m.d.cand) await pc.addIceCandidate(m.d.cand).catch(() => {});
    }
  };
  ws.onclose = () => { etiqueta.style.display = 'none'; };
  window.addEventListener('pagehide', () => ws.close());
}</script></body></html>
