<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Alicia Server — Jogar</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#e9ecf5;font-family:system-ui,sans-serif;overflow:hidden}
#game{width:100%;height:100%}
#topo{position:fixed;top:8px;left:8px;z-index:50;display:flex;gap:8px;align-items:center}
#topo a,#topo span{background:#1a1d27cc;color:#e9ecf5;padding:10px 16px;border-radius:12px;text-decoration:none;font-size:16px}
#topo a:focus,#topo a:hover{outline:3px solid #a78bfa}
#aviso{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:24px;font-size:20px;background:#0f1117;z-index:60}
</style></head>
<body>
<div id="topo"><a href="/" id="voltar" tabindex="0">⬅ Voltar aos jogos</a><span id="msg"></span></div>
<div id="aviso"><div id="avisoTxt"></div></div>
<div id="game"></div>
<script>
// Emulador rodando NO NAVEGADOR deste aparelho (EmulatorJS). O servidor só entrega o jogo e guarda o save.
const q = new URLSearchParams(location.search), pasta = q.get('c'), arquivo = q.get('a');
const $ = s => document.querySelector(s);
const qs = 'pasta=' + encodeURIComponent(pasta) + '&arquivo=' + encodeURIComponent(arquivo);
function erro(t){ $('#aviso').style.display='grid'; $('#avisoTxt').innerHTML = t + '<br><br><a href="/" style="color:#a78bfa">Voltar</a>'; }

(async () => {
  try {
    const info = await (await fetch('/api/jogos/info?pasta=' + encodeURIComponent(pasta))).json();
    if (!info.nucleo) return erro('Console desconhecido.');
    if (!info.emulador_instalado) return erro('O emulador ainda não está instalado no servidor.');
    window.EJS_player = '#game';
    window.EJS_core = info.nucleo;
    window.EJS_gameUrl = '/api/jogos/arquivo?' + qs;
    window.EJS_gameName = arquivo.replace(/\.[^.]+$/, '');
    window.EJS_pathtodata = '/ejs/';
    window.EJS_color = '#7c5cf0';
    window.EJS_startOnLoaded = true;           // começa sozinho, sem clicar em "play"
    window.EJS_language = 'pt-BR';
    window.EJS_threads = false;                // não exige cabeçalhos especiais; funciona em qualquer navegador
    if (pasta === 'PlayStation') {                     // BIOS do PS1 (se você colocou em Jogos/BIOS)
      const b = await fetch('/api/jogos/bios?pasta=PlayStation', {method: 'HEAD'});
      if (b.ok) window.EJS_biosUrl = '/api/jogos/bios?pasta=PlayStation';
      else $('#msg').textContent = 'Sem BIOS do PS1: alguns jogos podem não abrir (veja JOGOS.md).';
    }
    // Continua de onde parou, em qualquer aparelho: se existe save no servidor, carrega.
    const s = await fetch('/api/jogos/save?' + qs, {method: 'HEAD'});
    if (s.ok) { window.EJS_loadStateURL = '/api/jogos/save?' + qs; $('#msg').textContent = 'Continuando de onde você parou…'; }
    fetch('/api/jogos/inicio', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({pasta, arquivo})});

    // Salva o estado no servidor de tempos em tempos (a cada 2 min), ao pausar/sair e quando você usa o botão de salvar.
    let ultimo = 0;
    async function salvar() {
      try {
        const gm = window.EJS_emulator && window.EJS_emulator.gameManager;
        if (!gm) return;
        const st = gm.getState();
        if (!st || st.length < 1000) return;
        await fetch('/api/jogos/save?' + qs, {method:'POST', body: st, keepalive: st.length < 60000});
        ultimo = Date.now(); $('#msg').textContent = 'Progresso salvo ✓'; setTimeout(() => $('#msg').textContent = '', 2500);
      } catch (e) {}
    }
    window.EJS_onGameStart = () => { setInterval(salvar, 120000); };
    window.EJS_onSaveState = () => salvar();
    document.addEventListener('visibilitychange', () => { if (document.hidden) salvar(); });
    // Dentro do painel (camada sobre a página), "Voltar" só fecha o jogo e a música continua; fora dele, volta para o início.
    $('#voltar').addEventListener('click', async e => {
      e.preventDefault(); await salvar();
      if (window.parent !== window) parent.postMessage('fechar-jogo', location.origin); else location.href = '/';
    });

    const sc = document.createElement('script'); sc.src = '/ejs/loader.js';
    sc.onerror = () => erro('Não consegui carregar o emulador.'); document.body.appendChild(sc);
  } catch (e) { erro('Não consegui abrir o jogo. Confira se você está logado e se o servidor está ligado.'); }
})();
</script></body></html>
