<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Alicia Server — Jogar junto</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#e9ecf5;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
video{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#topo{position:fixed;top:8px;left:8px;right:8px;z-index:50;display:flex;gap:8px;align-items:center;pointer-events:none}
#topo>*{pointer-events:auto;background:#1a1d27cc;color:#e9ecf5;padding:10px 16px;border-radius:12px;text-decoration:none;font-size:16px;border:0;cursor:pointer}
#msg{margin-left:auto;background:#1a1d27cc}
#cobre{position:fixed;inset:0;z-index:60;display:grid;place-items:center;text-align:center;padding:24px;background:#0f1117;font-size:20px}
#cobre button{background:#7c5cf0;color:#fff;border:0;border-radius:14px;padding:16px 28px;font-size:20px;margin-top:18px;cursor:pointer}
#pad{position:fixed;inset:0;z-index:40;pointer-events:none;display:none}
#pad.on{display:block}
.b{position:absolute;pointer-events:auto;touch-action:none;display:grid;place-items:center;border-radius:50%;background:#ffffff26;border:2px solid #ffffff55;color:#fff;font-weight:700;font-size:4.2vmin;width:12vmin;height:12vmin;backdrop-filter:blur(2px)}
.b.act{background:#a78bfaaa;border-color:#fff}
.b.p{width:8.5vmin;height:8.5vmin;font-size:3.2vmin}
.b.r{border-radius:3vmin;width:15vmin;height:8vmin;font-size:3.4vmin}
</style></head>
<body>
<video id="v" autoplay playsinline></video>
<div id="pad"></div>
<div id="topo"><button id="voltar">⬅ Sair da sala</button><button id="tela" style="display:none">🎮 Controles na tela</button><span id="msg"></span></div>
<div id="cobre"><div><div id="cobreTxt">Conectando à sala…</div><button id="ir" style="display:none">▶ Entrar no jogo</button></div></div>
<script>
// Jogar junto: este aparelho só recebe a tela do anfitrião e manda os controles. O jogo roda no aparelho dele.
const $ = s => document.querySelector(s), q = new URLSearchParams(location.search), sala = (q.get('sala') || '').toUpperCase();
const video = $('#v'), ms = new MediaStream(); video.srcObject = ms;
let ws, pc, dc, slot = 0, pasta = '', fila = [], pronto = false;
const estado = {};
function enviar(i, v) { if (estado[i] === v) return; estado[i] = v; if (dc && dc.readyState === 'open') dc.send(JSON.stringify({ i, v })); }
function sair() { try { ws && ws.close(); } catch (e) {} if (window.parent !== window) parent.postMessage('fechar-jogo', location.origin); else location.href = '/'; }
$('#voltar').onclick = sair;
function aviso(t, botao) { $('#cobre').style.display = 'grid'; $('#cobreTxt').innerHTML = t; $('#ir').style.display = botao ? '' : 'none'; }

function conecta() {
  if (!sala) return aviso('Sem código de sala.<br><br><a href="/" style="color:#a78bfa">Voltar</a>');
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws/multi');
  ws.onopen = () => ws.send(JSON.stringify({ t: 'guest', sala }));
  ws.onclose = () => { if (!pronto) aviso('Desconectado da sala.<br><br><a href="/" style="color:#a78bfa">Voltar</a>'); };
  ws.onmessage = async ev => {
    const m = JSON.parse(ev.data);
    if (m.t === 'erro' || m.t === 'fim') { pronto = false; aviso(m.msg + '<br><br><button onclick="sair()">Sair</button>'); }
    else if (m.t === 'ok') { slot = m.slot; pasta = m.pasta; montaControles(); aviso('Entrando no jogo <b>' + m.nome + '</b> de ' + m.host + '…<br><small>Você é o jogador ' + (slot + 1) + '</small>'); }
    else if (m.t === 'sinal') {
      if (m.d.sdp) {
        pc = pc || novoPar();
        await pc.setRemoteDescription(m.d.sdp); await pc.setLocalDescription(await pc.createAnswer());
        ws.send(JSON.stringify({ t: 'sinal', d: { sdp: pc.localDescription } }));
        for (const c of fila.splice(0)) pc.addIceCandidate(c).catch(() => {});
      } else if (m.d.cand) { if (pc && pc.remoteDescription) pc.addIceCandidate(m.d.cand).catch(() => {}); else fila.push(m.d.cand); }
    }
  };
}
function novoPar() {
  const p = new RTCPeerConnection({ iceServers: [] });
  p.onicecandidate = e => { if (e.candidate) ws.send(JSON.stringify({ t: 'sinal', d: { cand: e.candidate } })); };
  p.ontrack = e => { ms.addTrack(e.track); video.play().catch(() => {}); pronto = true; aviso('Tudo pronto!', true); };
  p.ondatachannel = e => { dc = e.channel; };
  p.onconnectionstatechange = () => { if (['failed', 'disconnected', 'closed'].includes(p.connectionState)) { pronto = false; aviso('A conexão com o anfitrião caiu.<br><br><button onclick="sair()">Sair</button>'); } };
  return p;
}
$('#ir').onclick = () => { $('#cobre').style.display = 'none'; video.muted = false; video.play().catch(() => {}); };

// ---- teclado (mesmas teclas do emulador) ----
const TECLAS = { x: 0, s: 1, v: 2, enter: 3, arrowup: 4, arrowdown: 5, arrowleft: 6, arrowright: 7, z: 8, a: 9, q: 10, e: 11, tab: 12, r: 13 };
addEventListener('keydown', e => { const i = TECLAS[e.key.toLowerCase()]; if (i !== undefined) { e.preventDefault(); enviar(i, 1); } });
addEventListener('keyup', e => { const i = TECLAS[e.key.toLowerCase()]; if (i !== undefined) { e.preventDefault(); enviar(i, 0); } });
// ---- controle físico ----
const PAD = { 0: 8, 1: 0, 2: 9, 3: 1, 4: 10, 5: 11, 6: 12, 7: 13, 8: 2, 9: 3, 10: 14, 11: 15, 12: 4, 13: 5, 14: 6, 15: 7 };
function lePad() {
  for (const g of (navigator.getGamepads ? navigator.getGamepads() : [])) {
    if (!g) continue;
    g.buttons.forEach((b, k) => { if (PAD[k] !== undefined) enviar(PAD[k], b.pressed ? 1 : 0); });
    const eixo = (n, mais, menos) => { const v = Math.abs(g.axes[n] || 0) > .25 ? g.axes[n] : 0; enviar(mais, v > 0 ? Math.round(v * 32767) : 0); enviar(menos, v < 0 ? Math.round(-v * 32767) : 0); };
    eixo(0, 16, 17); eixo(1, 18, 19); eixo(2, 20, 21); eixo(3, 22, 23);
    break;
  }
  requestAnimationFrame(lePad);
}
requestAnimationFrame(lePad);

// ---- controles na tela (celular/tablet) ----
function montaControles() {
  const area = $('#pad'); area.textContent = '';
  const n64 = pasta === 'Nintendo 64', nes = pasta === 'Nintendo', psx = pasta === 'PlayStation';
  const botao = (rot, x, y, tipo, acao) => {
    const b = document.createElement('div'); b.className = 'b ' + (tipo || ''); b.textContent = rot; b.style.left = x; b.style.top = y;
    const liga = v => e => { e.preventDefault(); b.classList.toggle('act', !!v); acao(v); };
    b.addEventListener('pointerdown', e => { b.setPointerCapture(e.pointerId); liga(1)(e); });
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(t => b.addEventListener(t, liga(0)));
    area.appendChild(b);
  };
  const dig = i => v => enviar(i, v);
  const eixo = (i) => v => enviar(i, v ? 32767 : 0);
  const D = n64 ? [eixo(19), eixo(18), eixo(17), eixo(16)] : [dig(4), dig(5), dig(6), dig(7)];
  botao('▲', '14vmin', 'calc(100vh - 36vmin)', '', D[0]); botao('▼', '14vmin', 'calc(100vh - 12vmin)', '', D[1]);
  botao('◀', '3vmin', 'calc(100vh - 24vmin)', '', D[2]); botao('▶', '25vmin', 'calc(100vh - 24vmin)', '', D[3]);
  const R = 'calc(100vw - ', Y = 'calc(100vh - ';
  if (psx) { botao('△', R + '24vmin)', Y + '36vmin)', '', dig(9)); botao('✕', R + '24vmin)', Y + '12vmin)', '', dig(0)); botao('□', R + '36vmin)', Y + '24vmin)', '', dig(1)); botao('○', R + '12vmin)', Y + '24vmin)', '', dig(8)); }
  else if (nes) { botao('B', R + '36vmin)', Y + '20vmin)', '', dig(0)); botao('A', R + '18vmin)', Y + '26vmin)', '', dig(8)); }
  else if (n64) { botao('A', R + '36vmin)', Y + '16vmin)', '', dig(0)); botao('B', R + '22vmin)', Y + '26vmin)', '', dig(1)); botao('C▲', R + '18vmin)', Y + '48vmin)', 'p', eixo(21)); botao('C▼', R + '18vmin)', Y + '36vmin)', 'p', eixo(20)); botao('C◀', R + '28vmin)', Y + '42vmin)', 'p', eixo(23)); botao('C▶', R + '8vmin)', Y + '42vmin)', 'p', eixo(22)); }
  else { botao('X', R + '24vmin)', Y + '36vmin)', '', dig(9)); botao('B', R + '24vmin)', Y + '12vmin)', '', dig(0)); botao('Y', R + '36vmin)', Y + '24vmin)', '', dig(1)); botao('A', R + '12vmin)', Y + '24vmin)', '', dig(8)); }
  botao('L', '3vmin', '14vmin', 'r', dig(10)); botao('R', R + '18vmin)', '14vmin', 'r', dig(11));
  if (psx) { botao('L2', '3vmin', '24vmin', 'r', dig(12)); botao('R2', R + '18vmin)', '24vmin', 'r', dig(13)); }
  if (n64) botao('Z', '3vmin', '24vmin', 'r', dig(12));
  if (!n64) botao('SELECT', 'calc(50vw - 17vmin)', Y + '9vmin)', 'r', dig(2));
  botao('START', n64 ? 'calc(50vw - 7vmin)' : 'calc(50vw + 3vmin)', Y + '9vmin)', 'r', dig(3));
}
const toque = matchMedia('(pointer:coarse)').matches;
$('#tela').style.display = ''; $('#pad').classList.toggle('on', toque);
$('#tela').onclick = () => $('#pad').classList.toggle('on');
conecta();
</script></body></html>
